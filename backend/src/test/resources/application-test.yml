spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  h2:
    console:
      enabled: false

logging:
  level:
    com.jeeleducation.lms: INFO
    org.springframework: WARN
    org.hibernate: WARN

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tdGVzdGluZy1wdXJwb3Nlcw==
  expiration: 86400000
  refresh-expiration: 604800000

app:
  frontend-url: http://localhost:3000

spring.mail:
  enabled: false

