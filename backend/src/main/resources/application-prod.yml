spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.jeeleducation.lms: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET}

